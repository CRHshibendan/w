<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WiFi 管理 - 母站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #1a1a2e;
    padding: 20px 16px 40px;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 440px;
    margin: 0 auto;
  }
  .header {
    text-align: center;
    color: #fff;
    margin-bottom: 24px;
    padding-top: 10px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .header p {
    font-size: 13px;
    opacity: 0.85;
  }

  .add-card {
    background: rgba(255,255,255,0.96);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .add-card h2 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 12px;
    color: #8a8a9e;
    margin-bottom: 5px;
    font-weight: 500;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid #e8e8f0;
    border-radius: 11px;
    font-size: 14px;
    background: #f8f9fc;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: #667eea;
    background: #fff;
  }
  .form-row {
    display: flex;
    gap: 10px;
  }
  .form-row .form-group { flex: 1; }
  .btn-add {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    box-shadow: 0 6px 18px rgba(102,126,234,0.35);
    transition: transform 0.15s;
  }
  .btn-add:active { transform: scale(0.97); }

  .section-title {
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title .count {
    background: rgba(255,255,255,0.25);
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 12px;
  }

  .wifi-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .wifi-card {
    background: #fff;
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    animation: cardIn 0.3s ease-out;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .wifi-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .wifi-name {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a2e;
  }
  .wifi-enc {
    font-size: 11px;
    color: #667eea;
    background: rgba(102,126,234,0.1);
    padding: 3px 9px;
    border-radius: 8px;
    font-weight: 600;
  }
  .wifi-pwd-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #f5f6fa;
    border-radius: 11px;
    margin-bottom: 12px;
  }
  .wifi-pwd-label {
    font-size: 11px;
    color: #8a8a9e;
  }
  .wifi-pwd {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    font-family: monospace;
  }
  .icon-btn {
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .icon-btn:active { background: #eceef5; }
  .icon-btn svg { width: 17px; height: 17px; color: #8a8a9e; }

  .link-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #f0f4ff;
    border-radius: 11px;
    margin-bottom: 12px;
  }
  .link-row svg { width: 16px; height: 16px; color: #667eea; flex-shrink: 0; }
  .sub-link {
    flex: 1;
    font-size: 12px;
    color: #5a5a6e;
    word-break: break-all;
    font-family: monospace;
  }

  .card-actions {
    display: flex;
    gap: 8px;
  }
  .card-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: transform 0.15s, opacity 0.2s;
  }
  .card-actions button:active { transform: scale(0.96); }
  .btn-preview {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
  }
  .btn-copy {
    background: #f0f1f5;
    color: #5a5a6e;
  }
  .btn-delete {
    background: #ffeaea;
    color: #e74c3c;
    flex: 0.6;
  }

  .empty {
    text-align: center;
    color: rgba(255,255,255,0.8);
    padding: 40px 20px;
    font-size: 14px;
  }
  .empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.6; }

  .toast {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📶 WiFi 管理中心</h1>
      <p>添加 WiFi，生成专属子网站链接</p>
    </div>

    <div class="add-card">
      <h2>➕ 添加 WiFi</h2>
      <div class="form-group">
        <label>网络名称 (SSID)</label>
        <input type="text" id="ssidInput" placeholder="例如：13501">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>密码</label>
          <input type="text" id="pwdInput" placeholder="WiFi 密码">
        </div>
        <div class="form-group" style="max-width:120px;">
          <label>加密</label>
          <select id="encInput">
            <option value="WPA">WPA</option>
            <option value="WEP">WEP</option>
            <option value="nopass">无密码</option>
          </select>
        </div>
      </div>
      <button class="btn-add" id="addBtn">生成子网站</button>
    </div>

    <div class="section-title">
      <span>🗂️ 我的 WiFi</span>
      <span class="count" id="count">0</span>
    </div>

    <div class="wifi-list" id="wifiList"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'wifi_list';
  let wifiList = [];
  try {
    wifiList = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch(e) {}

  const $ = (id) => document.getElementById(id);

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(wifiList));
  }

  function encodeConfig(cfg) {
    const json = JSON.stringify({ s: cfg.ssid, p: cfg.password, e: cfg.encryption });
    return btoa(unescape(encodeURIComponent(json)));
  }

  function getSubUrl(id) {
    const base = location.href.replace(/[^/]*$/, '');
    return base + 'wifi.html#' + id;
  }

  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function copyText(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }

  function render() {
    const list = $('wifiList');
    $('count').textContent = wifiList.length;
    if (wifiList.length === 0) {
      list.innerHTML = `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <div>还没有添加 WiFi，在上方添加一个吧</div>
      </div>`;
      return;
    }
    list.innerHTML = wifiList.map((w, i) => {
      const url = getSubUrl(w.id);
      const encLabel = w.encryption === 'nopass' ? '开放' : w.encryption;
      return `
      <div class="wifi-card">
        <div class="wifi-card-header">
          <div class="wifi-name">${escapeHtml(w.ssid)}</div>
          <div class="wifi-enc">${encLabel}</div>
        </div>
        <div class="wifi-pwd-row">
          <span class="wifi-pwd-label">密码</span>
          <span class="wifi-pwd" id="pwd-${i}">${w.encryption === 'nopass' ? '—' : escapeHtml(w.password)}</span>
          ${w.encryption !== 'nopass' ? `<button class="icon-btn" onclick="togglePwd(${i})" aria-label="显示/隐藏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>` : ''}
        </div>
        <div class="link-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span class="sub-link">${url}</span>
        </div>
        <div class="card-actions">
          <button class="btn-preview" onclick="preview(${i})">预览子站</button>
          <button class="btn-copy" onclick="copyLink(${i})">复制链接</button>
          <button class="btn-delete" onclick="del(${i})">删除</button>
        </div>
      </div>`;
    }).join('');
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  const pwdVisible = {};
  window.togglePwd = function(i) {
    pwdVisible[i] = !pwdVisible[i];
    const el = $('pwd-' + i);
    const w = wifiList[i];
    el.textContent = pwdVisible[i] ? w.password : '••••••••';
  };

  window.preview = function(i) {
    window.open(getSubUrl(wifiList[i].id), '_blank');
  };

  window.copyLink = function(i) {
    copyText(getSubUrl(wifiList[i].id));
    showToast('链接已复制');
  };

  window.del = function(i) {
    if (!confirm('确定删除「' + wifiList[i].ssid + '」吗？')) return;
    wifiList.splice(i, 1);
    save();
    render();
    showToast('已删除');
  };

  $('addBtn').addEventListener('click', () => {
    const ssid = $('ssidInput').value.trim();
    const password = $('pwdInput').value;
    const encryption = $('encInput').value;
    if (!ssid) { showToast('请输入 WiFi 名称'); return; }
    if (encryption !== 'nopass' && !password) { showToast('请输入密码'); return; }

    const id = encodeConfig({ ssid, password, encryption });
    wifiList.unshift({ id, ssid, password, encryption });
    save();
    $('ssidInput').value = '';
    $('pwdInput').value = '';
    render();
    showToast('已生成子网站');
  });

  render();
</script>
</body>
</html>
